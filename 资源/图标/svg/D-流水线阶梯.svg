<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
  <clipPath id="clipD"><rect width="256" height="256" rx="56"/></clipPath>
  <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#142C4E"/><stop offset="1" stop-color="#07121E"/>
  </linearGradient>
  <pattern id="gridD" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0 H0 V32" fill="none" stroke="#27496F" stroke-width="1.4" opacity=".5"/>
  </pattern>
  <!-- 一条描边，从"起点蓝"走到"终点金" -->
  <linearGradient id="stepD" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0"  stop-color="#6FB6EE"/>
    <stop offset=".55" stop-color="#8FCBF3"/>
    <stop offset="1"  stop-color="#F5C86B"/>
  </linearGradient>
  <linearGradient id="goldD" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFE6B4"/><stop offset="1" stop-color="#E09B2E"/>
  </linearGradient>
</defs>
<g clip-path="url(#clipD)">
  <rect width="256" height="256" fill="url(#bgD)"/>
  <rect width="256" height="256" fill="url(#gridD)"/>

  <!-- 流水线：五级台阶逐级抬升，颜色随进度变金 -->
  <path d="M46 186 h28 v-26 h28 v-26 h28 v-26 h28 v-26 h36"
        fill="none" stroke="url(#stepD)" stroke-width="18"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 终点：点亮 -->
  <circle cx="204" cy="108" r="15" fill="url(#goldD)"/>
  <circle cx="199" cy="103" r="5" fill="#FFF6E4" opacity=".65"/>
</g>
</svg>
